name: CI/CD

on:
  push:
    branches:
      - main

jobs:

  build-and-push:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

              - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run backend tests
        run: |
          cd backend
          pytest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/task-backend:latest \
            ./backend

      - name: Push Backend
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/task-backend:latest

      - name: Build Frontend
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/task-frontend:latest \
            ./frontend

      - name: Push Frontend
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/task-frontend:latest